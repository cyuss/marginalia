name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The core workspace: domain, safety, database, simulator. No Tauri, no Node,
  # so this job is fast and is the gate that matters most.
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the pinned toolchain
        # Pinned to bash so this step reads the same on every runner. A bare
        # `run:` is PowerShell on windows-latest, which has no `sed` -- that is
        # what broke the Windows leg of the matrix while Linux and macOS passed.
        shell: bash
        run: |
          toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "rust-toolchain.toml pins $toolchain"
          rustup toolchain install "$toolchain" --component rustfmt --component clippy
          rustup default "$toolchain"
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Architecture boundaries
        run: cargo test -p marginalia-architecture-tests

      - name: Phase 0 characterization
        run: cargo test -p marginalia-characterization-tests

  # Proves the portable crates still build for the reMarkable 2. Cheap, and it
  # catches a non-portable dependency on the day it is added rather than at the
  # start of Phase 1.
  cross-compile:
    name: Cross-compile for reMarkable 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the pinned toolchain
        # Pinned to bash so this step reads the same on every runner. A bare
        # `run:` is PowerShell on windows-latest, which has no `sed` -- that is
        # what broke the Windows leg of the matrix while Linux and macOS passed.
        shell: bash
        run: |
          toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "rust-toolchain.toml pins $toolchain"
          rustup toolchain install "$toolchain" --component rustfmt --component clippy
          rustup default "$toolchain"
      - name: Add the reMarkable target to that toolchain
        run: |
          toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup target add armv7-unknown-linux-gnueabihf --toolchain "$toolchain"
          rustup target list --installed --toolchain "$toolchain"
      - uses: Swatinem/rust-cache@v2

      # Delegated to the Makefile so the crate list has one home. Duplicating it
      # here is how CI ends up checking a different set from the one developers
      # check locally.
      - name: Check portable crates for armv7
        run: make cross-check

  # Run separately and with output, so a failure here is impossible to miss in
  # the log. A pull request with a failing or skipped safety test does not merge.
  safety:
    name: Safety suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the pinned toolchain
        # Pinned to bash so this step reads the same on every runner. A bare
        # `run:` is PowerShell on windows-latest, which has no `sed` -- that is
        # what broke the Windows leg of the matrix while Linux and macOS passed.
        shell: bash
        run: |
          toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "rust-toolchain.toml pins $toolchain"
          rustup toolchain install "$toolchain" --component rustfmt --component clippy
          rustup default "$toolchain"
      - uses: Swatinem/rust-cache@v2

      - name: Safety suite
        run: cargo test -p marginalia-safety-suite -- --nocapture

      # A cheap grep is not a security boundary -- the type system is -- but it
      # catches an accidental reintroduction of a forbidden operation in a diff,
      # which is exactly when a human reviewer is least likely to notice.
      - name: No prohibited device operations
        run: |
          # grep -rIn emits "path:line:content", so the filter anchors on that
          # shape to drop hits that are inside a comment. Verified to keep a
          # real code hit and drop a documentation mention.
          #
          # `guard-allow:` lines are dropped too, matching the architecture
          # test in tests/architecture/tests/boundaries.rs. Both guards must
          # agree, or a line is legal locally and fails in CI. The exception
          # exists because a read-only extractor has to name the directory it
          # reads; naming it is not touching it.
          #
          # tests/architecture is excluded because that is where the forbidden
          # words are *defined*. Scanning the rule table for the words it lists
          # reports the guard as a violation of itself.
          #
          # apps/ is included: the agent is the code that actually runs on a
          # device, so leaving it out was the more serious gap.
          if grep -rInE '\b(xochitl|/usr/bin|systemctl|toltec)\b' \
               --include='*.rs' packages/ apps/ tests/ \
               --exclude-dir=architecture \
               | grep -vE '^[^:]+:[0-9]+: *(//|///|//!|#)' \
               | grep -v 'guard-allow:' ; then
            echo "::error::A reference to prohibited device territory appeared outside a comment."
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. package.json already declares
      # "packageManager": "pnpm@9.12.0", and action-setup fails outright when
      # given a second, independent source of truth. The manifest wins, so the
      # version developers use locally is the version CI uses.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @marginalia/desktop exec vite build

  # The Tauri shell is its own workspace with a much heavier toolchain, so it
  # builds separately and does not slow down the gate above.
  desktop:
    name: Desktop build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the pinned toolchain
        # Pinned to bash so this step reads the same on every runner. A bare
        # `run:` is PowerShell on windows-latest, which has no `sed` -- that is
        # what broke the Windows leg of the matrix while Linux and macOS passed.
        shell: bash
        run: |
          toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "rust-toolchain.toml pins $toolchain"
          rustup toolchain install "$toolchain" --component rustfmt --component clippy
          rustup default "$toolchain"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # No `version:` here on purpose. package.json already declares
      # "packageManager": "pnpm@9.12.0", and action-setup fails outright when
      # given a second, independent source of truth. The manifest wins, so the
      # version developers use locally is the version CI uses.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
