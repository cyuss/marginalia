# The toolchain this project is developed and tested against.
#
# Pinned so the dependency tree resolves consistently for everyone. rustup
# installs it automatically the first time you run cargo in this directory.
# (The old floor here was Tauri 2's; that shell is gone and no longer sets it.)
#
# Raised from 1.85 to 1.90 when the Zotero HTTP client landed: ureq's TLS chain
# pulls in the icu_* crates, which require 1.86+. Pinning around them was
# attempted first and does not work -- the whole idna/url subtree moved. This
# is a real MSRV data point for the standalone build (U16), not a preference.
[toolchain]
channel = "1.90.0"
components = ["rustfmt", "clippy"]
