# Marginalia — reMarkable firmware compatibility matrix.
#
# This file is DATA. It is deliberately separate from feature code so that a
# capability claim can be reviewed on its own.
#
# ── Rules ───────────────────────────────────────────────────────────────────
#
# 1. `tested_at` empty  ⇒  the loader forces UNKNOWN, whatever `status` says.
#    Optimism in a data file must not grant permissions.
#
# 2. UNKNOWN ⇒ read-only. Always.
#
# 3. An entry may only leave UNKNOWN via the validation procedure in
#    docs/remarkable/COMPATIBILITY_MODEL.md §6, and the validation write-up
#    must land in the same pull request.
#
# 4. Entries are matched in file order and the FIRST match wins. Version-
#    specific entries must therefore appear above the `3.x` defaults, or they
#    will never be reached. `the_specific_entry_wins_over_the_general_one` in
#    compatibility.rs holds this in place.
#
# ── Current state ───────────────────────────────────────────────────────────
#
# Two read capabilities have been validated on a reMarkable 2 running
# 3.28.0.166. Everything else is UNKNOWN, which means Marginalia can do nothing
# else to a device at all.
#
# See docs/remarkable/HARDWARE_VALIDATION.md for what was run and observed, and
# docs/development/OPEN_QUESTIONS.md — U1, U2, U5, U6.

# ── Validated on hardware — RM2 / 3.28.0.166 ────────────────────────────────
#
# These two are the only capabilities exercised end-to-end by doctor.sh and
# install.sh, which is why they are the only two leaving UNKNOWN. Neither
# writes anything: one reads identity, the other reads free space. Marking a
# capability SUPPORTED because a shell command worked once is exactly the
# optimism rule 1 exists to stop -- the difference here is that the command
# these entries describe IS the implementation, and it ran against a device.

[[entry]]
model = "RM2"
firmware = "3.28"
capability = "DeviceInfoRead"
status = "SUPPORTED"
tested_at = "2026-08-12"
method = "hardware"
notes = """
Read model, kernel and firmware from a device over SSH. The release is
3.28.0.166, from /usr/share/remarkable/update.conf; /etc/version holds a build
timestamp (20260806095513) and must not be read as a version.
"""

[[entry]]
model = "RM2"
firmware = "3.28"
capability = "StorageRead"
status = "SUPPORTED"
tested_at = "2026-08-12"
method = "hardware"
notes = """
`df -k /home` on the device, parsed by install.sh's storage check. Reported
1090 MB free of 6.4 GB. Note BusyBox coreutils: `tail -n 1`, never `tail -1`.
"""

