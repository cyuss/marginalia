# Marginalia — reMarkable firmware compatibility matrix.
#
# This file is DATA. It is deliberately separate from feature code so that a
# capability claim can be reviewed on its own.
#
# ── Rules ───────────────────────────────────────────────────────────────────
#
# 1. `tested_at` empty  ⇒  the loader forces UNKNOWN, whatever `status` says.
#    Optimism in a data file must not grant permissions.
#
# 2. UNKNOWN ⇒ read-only. Always.
#
# 3. An entry may only leave UNKNOWN via the validation procedure in
#    docs/remarkable/COMPATIBILITY_MODEL.md §6, and the validation write-up
#    must land in the same pull request.
#
# ── Current state ───────────────────────────────────────────────────────────
#
# Nothing has been validated on hardware yet. Every capability below is
# therefore UNKNOWN, which means Marginalia can currently do nothing to a
# device at all. That is the correct state for Phase 0.
#
# See docs/development/OPEN_QUESTIONS.md — U1, U2, U3, U5, U6.

