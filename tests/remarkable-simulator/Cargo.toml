[package]
name = "marginalia-simulator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "In-process reMarkable simulator. Makes dangerous situations testable without a device."

[dependencies]
marginalia-core.workspace = true
marginalia-safety.workspace = true
