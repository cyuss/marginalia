# Marginalia — Rust workspace.
#
# One workspace, one toolchain, no JavaScript. There was a second workspace for
# a Tauri desktop shell; it was six screens of mock interface wired to nothing,
# it had never once built (its icons were missing), and it cost two CI jobs. The
# terminal interface in apps/tui replaces it and lives here with everything else.
[workspace]
resolver = "2"
members = [
  "apps/remarkable",
  "apps/tui",
  "packages/core",
  "packages/safety",
  "packages/observability",
  "packages/database",
  "packages/remarkable",
  "packages/platform",
  "packages/zotero",
  "packages/library-folder",
  "packages/annotations",
  "packages/sync",
  "tests/remarkable-simulator",
  "tests/safety",
  "tests/architecture",
  "tests/characterization",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cyuss/marginalia"

[workspace.dependencies]
marginalia-core = { path = "packages/core" }
marginalia-safety = { path = "packages/safety" }
marginalia-observability = { path = "packages/observability" }
marginalia-database = { path = "packages/database" }
marginalia-remarkable = { path = "packages/remarkable" }
marginalia-platform = { path = "packages/platform" }
marginalia-zotero = { path = "packages/zotero" }
marginalia-library-folder = { path = "packages/library-folder" }
marginalia-annotations = { path = "packages/annotations" }
marginalia-sync = { path = "packages/sync" }
marginalia-simulator = { path = "tests/remarkable-simulator" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
ratatui = "0.29"
crossterm = "0.28"
thiserror = "1"
ulid = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = "0.8"
rusqlite = { version = "0.30", features = ["bundled"] }
