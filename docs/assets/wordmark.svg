<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200" role="img"
     aria-label="Marginalia — a research companion for reMarkable">
  <title>Marginalia</title>

  <defs>
    <style>
      .name { font: 500 62px ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
              fill: #F4F2ED; letter-spacing: -1.2px; }
      .tag  { font: 400 19px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
              fill: #9FB8AE; letter-spacing: 0.3px; }
    </style>
  </defs>

  <rect width="760" height="200" rx="14" fill="#1E3D35"/>

  <!-- the mark, at a size where the gesture still reads -->
  <g transform="translate(56 46) scale(0.42)">
    <g fill="#E8EFEC" opacity="0.34">
      <rect x="112" y="70"  width="86" height="9" rx="4.5"/>
      <rect x="112" y="96"  width="74" height="9" rx="4.5"/>
      <rect x="112" y="148" width="86" height="9" rx="4.5"/>
      <rect x="112" y="174" width="58" height="9" rx="4.5"/>
    </g>
    <rect x="112" y="118" width="86" height="14" rx="7" fill="#7FC0AA" opacity="0.9"/>
    <rect x="70" y="58" width="4" height="140" rx="2" fill="#E8EFEC" opacity="0.5"/>
    <path d="M40 122 L52 136 L86 96" fill="none" stroke="#FFFFFF" stroke-width="11"
          stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0 90;90 90" dur="1.1s" begin="0.3s" fill="freeze"/>
    </path>
  </g>

  <line x1="196" y1="52" x2="196" y2="148" stroke="#E8EFEC" stroke-width="1" opacity="0.22"/>

  <text class="name" x="234" y="106">Marginalia</text>
  <text class="tag"  x="236" y="140">A reading workflow for the reMarkable — and nothing else touched</text>
</svg>
