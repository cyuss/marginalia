<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" role="img"
     aria-label="Every device write needs a WriteGrant, which only the safety crate can construct. Ten checks run in order and any doubt denies.">
  <title>How a device write is authorised — and how it is refused</title>

  <defs>
    <style>
      .n  { font: 600 16px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1A1917; }
      .s  { font: 400 13px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #5C5952; }
      .t  { font: 500 11.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #8A867D;
            letter-spacing: 1.4px; }
      .m  { font: 400 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1A1917; }
      .mg { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #2F5D50; }
      .md { font: 400 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #8F3A32; }
    </style>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#8A867D"/>
    </marker>
    <marker id="a2d" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#8F3A32"/>
    </marker>
  </defs>

  <rect width="1200" height="460" rx="10" fill="#FBFAF8"/>

  <text class="t" x="52" y="48">THE ONLY PATH TO A DEVICE WRITE</text>

  <!-- request -->
  <rect x="52" y="72" width="184" height="76" rx="8" fill="#FFFFFF" stroke="#DFDCD5" stroke-width="1.5"/>
  <text class="n" x="72" y="104">A request</text>
  <text class="s" x="72" y="126">upload one PDF</text>

  <line x1="244" y1="110" x2="316" y2="110" stroke="#8A867D" stroke-width="1.6" marker-end="url(#a2)"/>

  <!-- the gauntlet -->
  <rect x="324" y="40" width="452" height="380" rx="8" fill="#FFFFFF" stroke="#2F5D50" stroke-width="2"/>
  <text class="n" x="348" y="72">SafetyManager::authorize</text>
  <text class="s" x="348" y="94">ten checks, in order · first failure denies</text>
  <line x1="348" y1="108" x2="752" y2="108" stroke="#DFDCD5"/>

  <g class="s">
    <text x="348" y="134">1 · classification — RED is refused, always</text>
    <text x="348" y="160">2 · feature flag for this operation class</text>
    <text x="348" y="186">3 · Safe Mode policy</text>
    <text x="348" y="212">4 · device identified, firmware known</text>
    <text x="348" y="238">5 · capability is SUPPORTED, not UNKNOWN</text>
    <text x="348" y="264">6 · a fresh ExplicitUserIntent for this document</text>
    <text x="348" y="290">7 · not already done (idempotency)</text>
    <text x="348" y="316">8 · PDF validated · checksum · storage + reserve</text>
    <text x="348" y="342">9 · a SafetySnapshot, created and verified</text>
    <text x="348" y="368">10 · a rollback plan that can actually run</text>
  </g>

  <!-- a travelling marker down the checks -->
  <circle r="4.5" cx="336" cy="130" fill="#2F5D50">
    <animate attributeName="cy" values="130;156;182;208;234;260;286;312;338;364;364"
             dur="5s" repeatCount="indefinite" keyTimes="0;0.09;0.18;0.27;0.36;0.45;0.54;0.63;0.72;0.81;1"/>
    <animate attributeName="opacity" values="0;1;1;1;0" dur="5s" repeatCount="indefinite"
             keyTimes="0;0.05;0.8;0.92;1"/>
  </circle>

  <text class="s" x="348" y="400" fill="#8F3A32">any doubt, any missing fact, any unknown → denied</text>

  <!-- outcomes -->
  <line x1="784" y1="140" x2="856" y2="140" stroke="#8A867D" stroke-width="1.6" marker-end="url(#a2)"/>
  <rect x="864" y="96" width="284" height="98" rx="8" fill="#FFFFFF" stroke="#2F5D50" stroke-width="2"/>
  <text class="n" x="888" y="126">Granted</text>
  <text class="mg" x="888" y="150">WriteGrant</text>
  <text class="s" x="888" y="172">single use · one operation · one</text>
  <text class="s" x="888" y="188">document · expires in 120 s</text>

  <line x1="784" y1="300" x2="856" y2="300" stroke="#8F3A32" stroke-width="1.6" marker-end="url(#a2d)"/>
  <rect x="864" y="256" width="284" height="98" rx="8" fill="#FFFFFF" stroke="#8F3A32" stroke-width="1.5"/>
  <text class="n" x="888" y="286">Denied</text>
  <text class="md" x="888" y="310">FirmwareUnknown</text>
  <text class="s" x="888" y="332">with a sentence the user can act</text>
  <text class="s" x="888" y="348">on, and a SAFETY log entry</text>

  <!-- the compile-time claim -->
  <line x1="52" y1="196" x2="52" y2="420" stroke="#DFDCD5" stroke-width="1"/>
  <text class="t" x="52" y="232">WHY IT CANNOT BE SKIPPED</text>
  <text class="s" x="52" y="260">Every write takes a</text>
  <text class="mg" x="52" y="280">&amp;WriteGrant</text>
  <text class="s" x="52" y="304">and that type holds a field</text>
  <text class="s" x="52" y="322">no other module can name.</text>
  <text class="s" x="52" y="352">Forgetting the check is not</text>
  <text class="s" x="52" y="370">a bug you ship —</text>
  <text class="n" x="52" y="396">it does not compile.</text>
</svg>
