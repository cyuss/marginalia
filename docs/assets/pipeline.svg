<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img"
     aria-label="Zotero syncs metadata to Marginalia continuously; a PDF moves to the reMarkable only when you ask; annotations flow back.">
  <title>How Marginalia moves things — and what it never moves</title>

  <defs>
    <!-- Opaque panel so the figure reads identically in light and dark GitHub themes. -->
    <style>
      .h  { font: 600 26px ui-serif, Georgia, serif; fill: #1A1917; }
      .n  { font: 600 17px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1A1917; }
      .s  { font: 400 13.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #5C5952; }
      .t  { font: 500 12px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #8A867D;
            letter-spacing: 1.4px; text-transform: uppercase; }
      .zero { font: 600 15px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #2F5D50; }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#8A867D"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#2F5D50"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="10" fill="#FBFAF8"/>

  <!-- ── nodes ─────────────────────────────────────────────────────── -->
  <g>
    <rect x="52" y="128" width="212" height="104" rx="8" fill="#FFFFFF" stroke="#DFDCD5" stroke-width="1.5"/>
    <text class="n" x="78" y="168">Zotero</text>
    <text class="s" x="78" y="192">your library,</text>
    <text class="s" x="78" y="211">unchanged</text>
  </g>

  <g>
    <rect x="482" y="104" width="236" height="152" rx="8" fill="#FFFFFF" stroke="#2F5D50" stroke-width="2"/>
    <text class="n" x="508" y="146">Marginalia</text>
    <text class="s" x="508" y="171">metadata · highlights</text>
    <text class="s" x="508" y="190">notes · search index</text>
    <text class="s" x="508" y="209">running on the device</text>
    <rect x="508" y="222" width="126" height="20" rx="10" fill="#E4EDE9"/>
    <text class="s" x="519" y="236" fill="#2F5D50">SQLite · local</text>
  </g>

  <g>
    <rect x="936" y="128" width="212" height="104" rx="8" fill="#FFFFFF" stroke="#DFDCD5" stroke-width="1.5"/>
    <text class="n" x="962" y="168">reMarkable 2</text>
    <text class="s" x="962" y="192">stock firmware,</text>
    <text class="s" x="962" y="211">nothing patched</text>
  </g>

  <!-- ── metadata path: continuous, cheap, automatic ─────────────────── -->
  <text class="t" x="286" y="120">metadata · automatic</text>
  <line x1="272" y1="160" x2="474" y2="160" stroke="#8A867D" stroke-width="1.6" marker-end="url(#ar)"/>
  <g fill="#5C5952">
    <circle r="4" cx="0" cy="160">
      <animate attributeName="cx" values="276;466" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" cx="0" cy="160">
      <animate attributeName="cx" values="276;466" dur="2.6s" begin="0.85s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" begin="0.85s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" cx="0" cy="160">
      <animate attributeName="cx" values="276;466" dur="2.6s" begin="1.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" begin="1.7s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text class="s" x="286" y="196">titles · authors · tags</text>
  <text class="s" x="286" y="214">collections · which</text>
  <text class="s" x="286" y="232">PDFs exist</text>
  <text class="zero" x="286" y="262">0 bytes of PDF</text>

  <!-- ── the request path: only after you ask ────────────────────────── -->
  <text class="t" x="742" y="120">one PDF · only when you ask</text>
  <line x1="726" y1="150" x2="928" y2="150" stroke="#2F5D50" stroke-width="2" marker-end="url(#arg)"
        stroke-dasharray="200" stroke-dashoffset="200">
    <animate attributeName="stroke-dashoffset" values="200;200;0;0;200" dur="6s" repeatCount="indefinite"
             keyTimes="0;0.3;0.5;0.9;1"/>
  </line>
  <circle r="5" cx="0" cy="150" fill="#2F5D50" opacity="0">
    <animate attributeName="cx" dur="6s" repeatCount="indefinite"
             keyTimes="0;0.35;0.55;1" values="730;730;924;924"/>
    <animate attributeName="opacity" values="0;0;1;1;0" dur="6s" repeatCount="indefinite" keyTimes="0;0.34;0.4;0.56;0.6"/>
  </circle>

  <!-- the tick that authorises it -->
  <g transform="translate(742 176)">
    <rect x="0" y="0" width="26" height="26" rx="4" fill="#FFFFFF" stroke="#1A1917" stroke-width="2"/>
    <path d="M5 13 L11 20 L21 5" fill="none" stroke="#1A1917" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="30" stroke-dashoffset="30">
      <animate attributeName="stroke-dashoffset" values="30;30;0;0;30" dur="6s" repeatCount="indefinite"
               keyTimes="0;0.2;0.32;0.9;1"/>
    </path>
    <text class="s" x="38" y="12">you tick a box</text>
    <text class="s" x="38" y="30">with the stylus</text>
  </g>

  <!-- ── annotations return ──────────────────────────────────────────── -->
  <path d="M1042 244 L1042 336 L600 336" fill="none" stroke="#8A867D" stroke-width="1.6" marker-end="url(#ar)"/>
  <g fill="#5C5952">
    <circle r="4">
      <animateMotion dur="3.4s" repeatCount="indefinite" path="M1042 244 L1042 336 L604 336"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="4">
      <animateMotion dur="3.4s" begin="1.7s" repeatCount="indefinite" path="M1042 244 L1042 336 L604 336"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.4s" begin="1.7s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text class="t" x="700" y="326">highlights · handwritten notes</text>

  <!-- ── the line that matters ───────────────────────────────────────── -->
  <line x1="52" y1="374" x2="1148" y2="374" stroke="#DFDCD5" stroke-width="1"/>
  <text class="s" x="52" y="398" fill="#1A1917">
    Syncing moves knowledge. Only a deliberate tick moves a file. They are different code paths, and the type system keeps them apart.
  </text>
</svg>
