<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img"
     aria-label="Marginalia logo: a page margin rule with a reader's mark beside it.">
  <title>Marginalia</title>
  <desc>A margin rule and the mark a reader leaves beside it — the gesture the
  whole product is built around.</desc>

  <rect width="256" height="256" rx="56" fill="#1E3D35"/>

  <!-- The text block: a page, abstracted to its lines. Deliberately quiet —
       the page is not the subject; what a reader does to it is. -->
  <g fill="#E8EFEC" opacity="0.34">
    <rect x="112" y="70"  width="86"  height="9" rx="4.5"/>
    <rect x="112" y="96"  width="74"  height="9" rx="4.5"/>
    <rect x="112" y="148" width="86"  height="9" rx="4.5"/>
    <rect x="112" y="174" width="58"  height="9" rx="4.5"/>
  </g>

  <!-- The highlighted line: the one that mattered. -->
  <rect x="112" y="118" width="86" height="14" rx="7" fill="#7FC0AA" opacity="0.9"/>

  <!-- The margin rule. -->
  <rect x="70" y="58" width="4" height="140" rx="2" fill="#E8EFEC" opacity="0.5"/>

  <!-- The mark in the margin. This is the product: a hand, a stylus, a
       deliberate gesture next to one specific line. -->
  <path d="M40 122 L52 136 L86 96" fill="none" stroke="#FFFFFF" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
