<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" role="img"
     aria-label="Marginalia generates an index document; you tick a box with the stylus; the agent reads that mark on its next sync and fetches that one paper.">
  <title>Asking for a paper, with no interface</title>

  <defs>
    <style>
      .n  { font: 600 15px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1A1917; }
      .s  { font: 400 12.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #5C5952; }
      .t  { font: 500 11.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #8A867D; letter-spacing: 1.4px; }
      .p  { font: 400 14px ui-serif, Georgia, serif; fill: #1A1917; }
      .pm { font: 400 11px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #767676; }
      .step { font: 600 12px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #2F5D50; letter-spacing: 1.2px; }
    </style>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#8A867D"/>
    </marker>
  </defs>

  <rect width="1200" height="400" rx="10" fill="#FBFAF8"/>

  <text class="t" x="52" y="44">NO CUSTOM UI · THE NATIVE READER IS THE INTERFACE</text>

  <!-- 1: generated document, e-ink panel -->
  <text class="step" x="52" y="80">1 — MARGINALIA GENERATES A DOCUMENT</text>
  <rect x="52" y="96" width="300" height="240" rx="5" fill="#F2F1EE" stroke="#C9C9C9" stroke-width="1.5"/>
  <text class="p" x="76" y="130" style="font-size:19px">Library</text>
  <line x1="76" y1="142" x2="328" y2="142" stroke="#1A1A1A" stroke-width="1.5"/>

  <g>
    <rect x="76" y="160" width="17" height="17" rx="2" fill="none" stroke="#1A1A1A" stroke-width="2"/>
    <text class="p" x="106" y="170">Attention Is All You Need</text>
    <text class="pm" x="106" y="186">Vaswani et al. · 2017 · 12.4 MB</text>
    <!-- the stylus tick draws itself -->
    <path d="M79 169 L84 175 L91 162" fill="none" stroke="#1A1A1A" stroke-width="2.6"
          stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="26" stroke-dashoffset="26">
      <animate attributeName="stroke-dashoffset" values="26;26;0;0;26" dur="7s" repeatCount="indefinite"
               keyTimes="0;0.16;0.26;0.9;1"/>
    </path>
  </g>

  <g>
    <rect x="76" y="204" width="17" height="17" rx="2" fill="none" stroke="#1A1A1A" stroke-width="2"/>
    <text class="p" x="106" y="214">BERT: Pre-training of Deep…</text>
    <text class="pm" x="106" y="230">Devlin et al. · 2018 · 8.1 MB</text>
  </g>

  <g>
    <rect x="76" y="248" width="17" height="17" rx="2" fill="#E6E6E6" stroke="#767676" stroke-width="2"/>
    <text class="p" x="106" y="258">Mamba: Linear-Time Sequence…</text>
    <text class="pm" x="106" y="274">Gu &amp; Dao · 2023 · already here</text>
  </g>

  <line x1="76" y1="296" x2="328" y2="296" stroke="#C9C9C9"/>
  <text class="pm" x="76" y="314">Tick a box to have that paper brought here.</text>

  <line x1="368" y1="216" x2="424" y2="216" stroke="#8A867D" stroke-width="1.6" marker-end="url(#a3)"/>

  <!-- 2: the mark is read -->
  <text class="step" x="440" y="80">2 — THE MARK IS READ BACK</text>
  <rect x="440" y="96" width="304" height="240" rx="8" fill="#FFFFFF" stroke="#DFDCD5" stroke-width="1.5"/>
  <text class="n" x="464" y="128">One mark, one meaning</text>
  <g class="s">
    <text x="464" y="158">✓ lands in exactly one box</text>
    <text x="464" y="182">✓ covers enough of it to be a tick</text>
    <text x="464" y="206">✓ on the current index, not last week’s</text>
    <text x="464" y="236" fill="#8F3A32">✗ crossing two boxes → ambiguous</text>
    <text x="464" y="260" fill="#8F3A32">✗ a passing stroke → not a request</text>
    <text x="464" y="284" fill="#8F3A32">✗ reading or highlighting → not a request</text>
  </g>
  <line x1="464" y1="302" x2="720" y2="302" stroke="#DFDCD5"/>
  <text class="s" x="464" y="322">Ambiguity is never guessed.</text>

  <line x1="760" y1="216" x2="816" y2="216" stroke="#8A867D" stroke-width="1.6" marker-end="url(#a3)"/>

  <!-- 3: same authorisation as a button -->
  <text class="step" x="832" y="80">3 — THE SAME GATE AS A BUTTON</text>
  <rect x="832" y="96" width="316" height="240" rx="8" fill="#FFFFFF" stroke="#2F5D50" stroke-width="2"/>
  <g class="s">
    <text x="856" y="130" class="n">ExplicitUserIntent</text>
    <text x="856" y="154">a deliberate act, on one document,</text>
    <text x="856" y="172">at a knowable time</text>

    <text x="856" y="206" class="n">SafetyManager</text>
    <text x="856" y="230">ten checks · fails closed</text>

    <text x="856" y="264" class="n">WriteGrant</text>
    <text x="856" y="288">one PDF fetched, verified, journalled</text>
  </g>
  <circle cx="1120" cy="122" r="6" fill="#2F5D50" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" dur="7s" repeatCount="indefinite"
             keyTimes="0;0.3;0.4;0.9;1"/>
  </circle>
  <line x1="856" y1="306" x2="1124" y2="306" stroke="#DFDCD5"/>
  <text class="s" x="856" y="326">A stylus mark and a click are indistinguishable here.</text>

  <text class="s" x="52" y="374" fill="#1A1917">The mark persists and can be re-read — better evidence of intent than a click, and it needs only permission to *read* your annotations.</text>
</svg>
